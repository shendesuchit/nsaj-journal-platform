[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nsaj-fastapi"
version = "0.1.0"
description = "Custom journal platform backend for the Noble Scientific Advances Journal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "cryptography==46.0.5",
    "fastapi==0.159.1",
    "python-multipart==0.0.32",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
nsaj-admin = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
